name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12"]
        include:
          # ADR-0019: Windows support is a preview; this proves the Python
          # code on Windows, not that a host calls the hooks there.
          - os: windows-latest
            python-version: "3.12"
          # A Korean Windows user: Python 3.9 (the TOML fallback parser) and a
          # temp directory with a non-ASCII name, the condition that hid the
          # output-decoding and path bugs behind an English, ASCII runner. A
          # cp949 locale cannot be set on the runner; the tests that need it
          # patch locale.getpreferredencoding or force PYTHONIOENCODING.
          - os: windows-latest
            python-version: "3.9"
            non_ascii_temp: true
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Non-ASCII temp directory
        if: ${{ matrix.non_ascii_temp }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "임시 폴더"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "TEMP=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: gate_no_abs_paths
        run: python tools/gate_no_abs_paths.py

      - name: gate_skill_size
        run: python tools/gate_skill_size.py

      - name: gate_blob_size
        run: python tools/gate_blob_size.py

      - name: gate_forbidden_phrases
        run: python tools/gate_forbidden_phrases.py

      - name: gate_manifest
        run: python tools/gate_manifest.py

      - name: gate_readme_sync
        run: python tools/gate_readme_sync.py

      - name: gate_command_invocations
        run: python tools/gate_command_invocations.py

      - name: gate_manual_accuracy
        run: python tools/gate_manual_accuracy.py

      - name: gate_clean_room
        run: python tools/gate_clean_room.py

      - name: run_tests
        run: python tools/run_tests.py
